name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:

jobs:
  # General stats card
  general:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate General Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/general.svg
          user: Mithun-07241
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes

  # Languages card
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Languages Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/languages.svg
          user: Mithun-07241
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github

  # Streak and habits card
  streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Streak Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/streak.svg
          user: Mithun-07241
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14
          plugin_habits_from: 200

  # Achievements card
  achievements:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Achievements Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/achievements.svg
          user: Mithun-07241
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0

  # Activity calendar card
  calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Calendar Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/calendar.svg
          user: Mithun-07241
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  # Additional metrics - Notable contributions
  notable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Notable Contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/notable.svg
          user: Mithun-07241
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          plugin_notable: yes
          plugin_notable_repositories: yes
          plugin_notable_from: organization

  # Code lines metrics
  lines:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Lines Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/lines.svg
          user: Mithun-07241
          template: classic
          base: repositories
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1

  # AniList - Anime and Manga tracking
  anilist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate AniList Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/anilist.svg
          user: Mithun-07241
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          plugin_anilist: yes
          plugin_anilist_user: .user.login
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites, characters
          plugin_anilist_limit: 2
          plugin_anilist_limit_characters: 22
          plugin_anilist_shuffle: yes

  # Music - Spotify/Apple Music
  music:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Music Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/music.svg
          user: Mithun-07241
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          plugin_music: yes
          plugin_music_provider: spotify
          plugin_music_mode: recent
          plugin_music_limit: 10
          plugin_music_user: .user.login
          plugin_music_token: ${{ secrets.SPOTIFY_TOKEN }}

  # Create placeholder SVG
  placeholder:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Create Placeholder SVG
        run: |
          mkdir -p metrics
          cat > metrics/placeholder.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1" height="1">
            <rect width="1" height="1" fill="transparent"/>
          </svg>
          EOF
      - name: Commit placeholder
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add metrics/placeholder.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Add placeholder SVG"
          git push
